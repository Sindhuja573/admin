<div class="form-container">
    <h2>Register</h2>
    <form [formGroup]="registerForm" (ngSubmit)="register()" class="form">
      
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="Enter your email">
        <div class="error" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
          Valid email is required.
        </div>
      </div>
  
      <div class="form-group">
        <label>Password</label>
        <div class="password-container">
          <input [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="Enter your password">
          <button type="button" class="eye-btn" (click)="togglePassword()">
            {{ hidePassword ? '👁️' : '🙈' }}
          </button>
        </div>
        <div class="error" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
          Password must be at least 6 characters.
        </div>
      </div>
  
      <button type="submit" class="btn">Register</button>
  
      <div class="message">{{message}}</div>
      <p class="link">Already have an account? <a routerLink="/login">Login here</a></p>
    </form>
  </div>
