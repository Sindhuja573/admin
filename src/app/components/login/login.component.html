<div class="form-container">
    <h2>Login</h2>
    <form [formGroup]="loginForm" (ngSubmit)="login()" class="form">
  
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="Enter your email">
        <div class="error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Valid email is required.
        </div>
      </div>
  
      <div class="form-group">
        <label>Password</label>
        <div class="password-container">
          <input [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="Enter your password">
          <button type="button" class="eye-btn" (click)="togglePassword()">
            {{ hidePassword ? '👁️' : '🙈' }}
          </button>
        </div>
        <div class="error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Password is required.
        </div>
      </div>
  
      <button type="submit" class="btn">Login</button>
  
      <div class="message">{{message}}</div>
      <p class="link">New user? <a routerLink="/register">Register here</a></p>
    </form>
  </div>
